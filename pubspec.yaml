name: moodoo
description: "track your days, create your own mood calendar with moodoo"
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.1
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  shared_preferences: ^2.5.5
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^6.1.3
  flutter_secure_storage: ^9.2.2
  http: ^1.4.0
  web_socket_channel: ^3.0.1
  flutter_launcher_icons: ^0.14.4
  loading_animation_widget: ^1.3.0
  flutter_native_splash: ^2.4.6
  flutter_local_notifications: ^18.0.0
  flutter_timezone: ^1.0.4
  timezone: ^0.9.4
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon_dark.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1C1C1C"
  adaptive_icon_foreground: "assets/logos/moodoo-cow-light.png"

flutter_native_splash:
  color: "#1C1C1C"
  color_dark: "#1C1C1C"
  image: assets/logos/moodoo-cow-light.png
  image_dark: assets/logos/moodoo-cow-light.png
  android_12:
    color: "#1C1C1C"
    color_dark: "#1C1C1C"
    image: assets/logos/moodoo-cow-light.png
    image_dark: assets/logos/moodoo-cow-light.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/icons/
    - assets/images/
